<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>fixture: in-page-container</title>
<style>
  /* ページ自体は普通にスクロールする。overflow の指定はしない */
  body {
    margin: 0;
    font-family: sans-serif;
    color: #333;
  }

  /* 上下の余白。それぞれ画面2つ分以上あるので、途中のコンテナが
     画面の上端・下端から一部はみ出す位置に来る */
  .filler {
    min-height: 220vh;
    padding: 24px 40px;
    box-sizing: border-box;
    line-height: 1.9;
    background: repeating-linear-gradient(to bottom, #fafafa 0 99px, #eee 99px 100px);
  }
  .filler p { margin: 0 0 1em; }
  .filler .marker {
    font-weight: bold;
    color: #555;
  }

  .mid-container {
    height: 400px;
    overflow-y: auto;
    border: 2px solid #333;
    margin: 0 auto;
    max-width: 640px;
    background: #fff;
  }

  .nested-container {
    height: 160px;
    overflow-y: auto;
    border: 2px dashed #c0392b;
    margin: 4px 12px;
    background: #fff6f5;
  }

  .row {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    padding: 0 12px;
  }
  .row.even { background: #ffffff; }
  .row.odd  { background: #f2f4f7; }
  .nested-container .row.even { background: #fff6f5; }
  .nested-container .row.odd  { background: #fde9e7; }

  .ruler {
    flex: 0 0 40px;
    width: 40px;
    text-align: right;
    padding-right: 8px;
    margin-right: 12px;
    font-size: 11px;
    color: #999;
    border-right: 1px solid #ddd;
  }
  .label {
    font-size: 18px;
    font-weight: bold;
    color: #222;
  }
  .nested-container .label { font-size: 15px; }

  .nested-title {
    font-size: 12px;
    font-weight: bold;
    color: #c0392b;
    padding: 4px 12px;
    background: #fde9e7;
    border-bottom: 1px dashed #c0392b;
  }
</style>
</head>
<body>

  <div class="filler" id="filler-top"></div>

  <div class="mid-container" id="mid-container"></div>

  <div class="filler" id="filler-bottom"></div>

<script>
  // 上下の余白段落。決定的な固定文を繰り返して十分な高さを作る
  function buildFiller(label) {
    var sentence = 'これはスクロール確認用の固定テキストです。乱数は使わず、常に同じ内容になります。';
    var parts = ['<p class="marker">-- ' + label + ' (この上に十分な余白があります) --</p>'];
    for (var i = 0; i < 24; i++) {
      parts.push('<p>' + sentence + ' (段落 ' + String(i + 1).padStart(2, '0') + ')</p>');
    }
    parts.push('<p class="marker">-- ' + label + ' 終わり --</p>');
    return parts.join('');
  }
  document.getElementById('filler-top').innerHTML = buildFiller('上の余白');
  document.getElementById('filler-bottom').innerHTML = buildFiller('下の余白');

  // 1行分のHTMLを作る関数。目盛り・大きな行番号・交互の背景色・3段階の高さを付ける
  // index は 0始まりの通し番号(高さ・背景色の切り替えに使う)
  function buildRow(index) {
    var heights = [40, 56, 72];
    var h = heights[index % 3];
    var bg = index % 2 === 0 ? 'even' : 'odd';
    var num = String(index + 1).padStart(3, '0');
    return (
      '<div class="row ' + bg + '" style="height:' + h + 'px">' +
      '<span class="ruler">' + num + '</span>' +
      '<span class="label">Row ' + num + '</span>' +
      '</div>'
    );
  }
  function buildRows(count) {
    var parts = [];
    for (var i = 0; i < count; i++) {
      parts.push(buildRow(i));
    }
    return parts.join('');
  }

  // 中段コンテナ: 150行。60〜70行目あたりに入れ子コンテナ(30行)を挟む
  (function () {
    var count = 150;
    var nestedAt = 60; // この行の直後に入れ子コンテナを挿入する(60〜70行目のあたりに位置する)
    var parts = [];
    for (var i = 0; i < count; i++) {
      parts.push(buildRow(i));
      if (i + 1 === nestedAt) {
        parts.push(
          '<div class="nested-container">' +
          '<div class="nested-title">入れ子コンテナ(30行)</div>' +
          buildRows(30) +
          '</div>'
        );
      }
    }
    document.getElementById('mid-container').innerHTML = parts.join('');
  })();
</script>
</body>
</html>
