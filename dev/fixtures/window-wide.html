<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>fixture: window-wide (リグレッション確認用)</title>
<style>
  /* 特別な指定はしない。window スクロールの通常ページを再現する */
  body {
    margin: 0;
    font-family: sans-serif;
    color: #333;
  }

  /* 幅2000pxの要素。これがあることでページ全体が横にもスクロールできるようになる */
  .wide-marker {
    width: 2000px;
    height: 72px;
    box-sizing: border-box;
    padding: 8px 12px;
    background: repeating-linear-gradient(to right, #dde 0 99px, #ccd 99px 100px);
    font-size: 12px;
    color: #333;
    position: relative;
  }
  .wide-marker .tick {
    position: absolute;
    top: 28px;
    font-weight: bold;
  }

  .row {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    padding: 0 12px;
  }
  .row.even { background: #ffffff; }
  .row.odd  { background: #f2f4f7; }

  .ruler {
    flex: 0 0 40px;
    width: 40px;
    text-align: right;
    padding-right: 8px;
    margin-right: 12px;
    font-size: 11px;
    color: #999;
    border-right: 1px solid #ddd;
  }
  .label {
    font-size: 18px;
    font-weight: bold;
    color: #222;
  }
</style>
</head>
<body>
  <div class="wide-marker" id="wide-marker">
    幅2000pxの要素(横スクロールの確認用)。0pxを起点に100pxごとに目盛りを表示しています。
  </div>
  <div id="rows"></div>

<script>
  // 幅2000pxの要素に100pxごとの目盛りを表示する。横スクロール時にも
  // 切り出し位置がズレていないか目で確認できるようにするための目印
  (function () {
    var marker = document.getElementById('wide-marker');
    for (var x = 0; x <= 2000; x += 100) {
      var tick = document.createElement('span');
      tick.className = 'tick';
      tick.style.left = x + 'px';
      tick.textContent = String(x);
      marker.appendChild(tick);
    }
  })();

  // 通常の行。200行。目盛り・大きな行番号・交互の背景色・3段階の高さを付ける
  (function () {
    var heights = [40, 56, 72];
    var count = 200;
    var parts = [];
    for (var i = 0; i < count; i++) {
      var h = heights[i % 3];
      var bg = i % 2 === 0 ? 'even' : 'odd';
      var num = String(i + 1).padStart(3, '0');
      parts.push(
        '<div class="row ' + bg + '" style="height:' + h + 'px">' +
        '<span class="ruler">' + num + '</span>' +
        '<span class="label">Row ' + num + '</span>' +
        '</div>'
      );
    }
    document.getElementById('rows').innerHTML = parts.join('');
  })();
</script>
</body>
</html>
